services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aerokrypt-postgis
    restart: always
    environment:
      POSTGRES_DB: aerokrypt
      POSTGRES_USER: aerokrypt_user
      POSTGRES_PASSWORD: aerokrypt_secure_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerokrypt_user -d aerokrypt"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aerokrypt-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerokrypt-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://aerokrypt_user:aerokrypt_secure_password_dev@db:5432/aerokrypt
      ENVIRONMENT: development
      PORT: 8000
      RASTER_CACHE_DIR: /app/raster_cache
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - raster_cache:/app/raster_cache
    networks:
      - aerokrypt-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aerokrypt-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - aerokrypt-network

volumes:
  postgres_data:
    name: aerokrypt_postgres_data
  raster_cache:
    name: aerokrypt_raster_cache

networks:
  aerokrypt-network:
    name: aerokrypt-network
    driver: bridge

